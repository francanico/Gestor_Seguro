{% extends "base.html" %}

{% block title %}Contraseña Restablecida{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm text-center">
            <div class="card-body">
                <h4 class="card-title text-success mb-4"><i class="fas fa-check-circle fa-2x"></i></h4>
                <h5>¡Contraseña actualizada!</h5>
                <p class="card-text mt-3">Tu contraseña ha sido restablecida exitosamente. Ahora puedes iniciar sesión con tu nueva contraseña.</p>
                <a href="{% url 'login' %}" class="btn btn-primary mt-3">Iniciar Sesión</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
